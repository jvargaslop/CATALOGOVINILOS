<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%BF%3C/text%3E%3C/svg%3E">
<title>Dyler Music · Escarba el catálogo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1efec;--card:#fff;--ink:#16181f;--mute:#6b6f7a;--line:#dcd8d2;--wa:#128c4a;--sheet:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1e33;--ink:#eef0f8;--mute:#9aa0b8;--line:#2b3050;--wa:#25c26a;--sheet:#1a1e33}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1e33;--ink:#eef0f8;--mute:#9aa0b8;--line:#2b3050;--wa:#25c26a;--sheet:#1a1e33}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 'Bricolage Grotesque',system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{padding:16px 16px 0}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.sub{margin:2px 0 12px;color:var(--mute);font-size:13px}
.divs{display:flex;gap:4px;overflow-x:auto;padding:0 16px;scrollbar-width:none;border-bottom:2px solid var(--ink)}
.divs::-webkit-scrollbar,.crate::-webkit-scrollbar{display:none}
.dv{flex:none;border:2px solid var(--ink);border-bottom:0;background:transparent;color:var(--ink);border-radius:10px 10px 0 0;padding:8px 13px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.dv[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:8px;padding:12px 16px 4px}
.tools input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;color:var(--mute);font-size:13px}
.nav b{color:var(--ink)}
.crate{position:relative;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:34px max(11vw,calc(50% - 150px)) 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.crate.grid{flex-wrap:wrap;overflow:visible;scroll-snap-type:none;padding:34px 12px 18px;justify-content:center}
.card{flex:none;width:76vw;max-width:300px;scroll-snap-align:center;scroll-snap-stop:always;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 10px 12px;transition:transform .3s}
.grid .card{width:calc(50% - 8px);max-width:none;padding:0 8px 10px}
.cover{position:relative;aspect-ratio:1;margin-top:-22px}
.disc{position:absolute;left:3%;top:0;width:94%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,hsl(var(--h) 70% 55%) 0 17%,#0b0b0d 17.5%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 3px,rgba(255,255,255,.07) 3px 4px)}
.on .disc,.grid .disc{transform:translateY(-16%)}
.face{position:absolute;inset:0;border-radius:6px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(145deg,hsl(var(--h) 55% 40%),hsl(calc(var(--h) + 50) 60% 18%));box-shadow:0 6px 16px rgba(0,0,0,.28)}
.fmt{position:absolute;top:10px;left:10px;font-size:12px;font-weight:800;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:6px}
.an{font-weight:800;font-size:20px;line-height:1.1;overflow-wrap:anywhere}
.at{font-size:13px;opacity:.88;margin-top:4px;overflow-wrap:anywhere}
.grid .an{font-size:15px}.grid .at{font-size:11px}
.info{padding-top:12px}.face.img{background-size:cover;background-position:center}.face.img .an,.face.img .at{display:none}.nm{font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}.nm small{display:block;color:var(--mute);font-weight:400}.sp{display:block;text-align:center;font-weight:600;font-size:14px;color:var(--ink);padding:8px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;text-decoration:none}
.price{font-size:22px;font-weight:800}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 10px;min-height:22px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--ink)}
.acts{display:grid;gap:6px}
.add,.buy{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;border-radius:10px;padding:11px;min-height:44px;cursor:pointer}
.add{border:2px solid var(--ink);background:transparent;color:var(--ink)}
.add.in{background:var(--ink);color:var(--bg)}
.buy{border:0;background:var(--wa);color:#fff}
.grid .acts{font-size:13px}
.empty{padding:50px 20px;text-align:center;color:var(--mute);width:100%}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:10}
.bottom .buy,.bottom .add{margin:0}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.panel{background:var(--sheet);width:100%;max-height:82%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 8px;font-size:20px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li small{color:var(--mute);display:block}
.x{border:0;background:transparent;color:var(--mute);font-size:22px;cursor:pointer;padding:6px 10px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:10px 0}
:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
@media (pointer:fine){.crate:not(.grid){cursor:grab}}.crate.drag{cursor:grabbing;user-select:none;scroll-snap-type:none}.crate.drag *{pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>Dyler Music</h1><p class="sub">Escarba la caja, elige y pide por WhatsApp</p></header>
<div class="divs" id="divs" role="tablist"></div>
<div class="tools"><input id="q" type="search" placeholder="Buscar artista o título" aria-label="Buscar"><button class="btn" id="rnd">Al azar</button><button class="btn" id="vw" aria-label="Cambiar vista">Lista</button></div>
<div class="chips" id="chips"></div>
<div class="nav"><button class="btn" id="pv" aria-label="Anterior">‹</button><span id="cnt"></span><button class="btn" id="nx" aria-label="Siguiente">›</button></div>
<div class="crate" id="crate"></div>
<div class="bottom" id="bottom"></div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<script>
const WA="";/* Número con código de país, sin + ni espacios. Ej: 573001234567 */
const RAW={"VINILOS ROCK - ROMANTICA": [["ABBA / VOULEZ VOUS", 60000, ""], ["BARBRA STREISAND / GREATEST HITS I", 40000, ""], ["BOSTON / BOSTON", 120000, "PRENSADO EN USA"], ["EAGLES / GREATEST HITS", 60000, "PRENSADO EN USA"], ["EKHYMOSIS / NIÑO GIGANTE", 140000, "NUEVO - REEDICION"], ["GARY NUMAN & TUBEWAY ARMY / REPLICAS", 120000, "PRENSADO EN U.K"]], "VINILOS TROPICAL- SALSA Y MAS": [["ANIBAL TROILO / AQUELLAS CANCIONES", 35000, ""], ["CHARANGA AMERICA / THE VERY BEST", 70000, "PRENSADO EN USA"], ["GRUPO NICHE / CIELO DE TAMBORES", 130000, "NUEVO - SELLADO - REEDICION"], ["JERRY RIVERA / CUENTA CONMIGO", 45000, ""]], "CDS": [["GRUPO NICHE / CIELO DE TAMBORES", 30000, ""]]};
const COVERS={"ABBA / VOULEZ VOUS": {"i": "img/abba-voulez-vous.jpg"}, "BOSTON / BOSTON": {"i": "img/boston-boston.jpg"}, "EAGLES / GREATEST HITS": {"i": "img/eagles-greatest-hits.jpg"}, "GARY NUMAN & TUBEWAY ARMY / REPLICAS": {"i": "img/gary-numan-tubeway-army-replicas.jpg"}, "EKHYMOSIS / NIÑO GIGANTE": {"i": "img/ekhymosis-nino-gigante.jpg"}, "BARBRA STREISAND / GREATEST HITS I": {"i": "img/barbra-streisand-greatest-hits-i.jpg"}, "GRUPO NICHE / CIELO DE TAMBORES": {"i": "img/grupo-niche-cielo-de-tambores.jpg"}, "CHARANGA AMERICA / THE VERY BEST": {"i": "img/charanga-america-the-very-best.jpg"}, "ANIBAL TROILO / AQUELLAS CANCIONES": {"i": "img/anibal-troilo-aquellas-canciones.jpg"}, "JERRY RIVERA / CUENTA CONMIGO": {"i": "img/jerry-rivera-cuenta-conmigo.jpg"}};
const NAMES={"VINILOS ROCK - ROMANTICA":["Rock y romántica","LP"],"VINILOS TROPICAL- SALSA Y MAS":["Tropical y salsa","LP"],"VINILOS PROMOCION":["Promoción","LP"],"SENCILLOS 45 RPM":["Sencillos 45","45"],"CDS":["CDs","CD"],"CASSETTE":["Cassettes","MC"],"DVD":["DVD","DVD"]};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.toLowerCase().replace(/(^|[\s(\-\/])(\S)/g,(m,a,b)=>a+b.toUpperCase());
const fmt=n=>'$'+n.toLocaleString('es-CO');
let uid=0;
const cats=Object.keys(RAW).map(k=>{const [name,f]=NAMES[k.trim()]||[k,''];return{name,f,items:RAW[k].map(([n,p,o])=>{const i=n.indexOf(' / ');const art=cap(i>0?n.slice(0,i):n),ttl=i>0?cap(n.slice(i+3)):'';const O=o.toUpperCase();let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;
return{id:uid++,n,f,art,ttl,p,tags:o?o.split(/\s+-\s+/).map(t=>cap(t.trim())):[],nuevo:/NUEVO|SELLADO/.test(O),imp:/PRENSADO EN/.test(O),peli:/^PELICULA/.test(n.toUpperCase()),h,s:(n+' '+o).toLowerCase()}})}});
const defs={nuevo:['Nuevo o sellado',x=>x.nuevo],imp:['Prensado afuera',x=>x.imp],peli:['Películas',x=>x.peli],b1:['Hasta $20.000',x=>x.p<=20000],b2:['$20.000–$50.000',x=>x.p>20000&&x.p<=50000],b3:['Más de $50.000',x=>x.p>50000]};
let cur=0,filt=new Set(),list=[],cart=new Map(),idx=0;
try{JSON.parse(localStorage.getItem('dm_cart')||'[]').forEach(x=>cart.set(x.id,x))}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('dm_cart',JSON.stringify([...cart.values()]))}catch(e){}};
$('divs').innerHTML=cats.map((c,i)=>`<button class="dv" role="tab" data-i="${i}">${c.name}</button>`).join('');
$('divs').onclick=e=>{const b=e.target.closest('.dv');if(b){cur=+b.dataset.i;filt.clear();chips();render()}};
function chips(){const it=cats[cur].items;$('chips').innerHTML=Object.keys(defs).filter(k=>it.some(defs[k][1])).map(k=>`<button class="chip" data-k="${k}" aria-pressed="${filt.has(k)}">${defs[k][0]}</button>`).join('')}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const k=b.dataset.k;if(k[0]=='b')['b1','b2','b3'].forEach(x=>x!=k&&filt.delete(x));filt.has(k)?filt.delete(k):filt.add(k);chips();render()};
const msgFor=a=>'Hola Dyler Music, quiero comprar:\n'+a.map(x=>`• ${x.art}${x.ttl?' - '+x.ttl:''} (${x.f}) ${fmt(x.p)}`).join('\n')+(a.length>1?'\nTotal: '+fmt(a.reduce((s,x)=>s+x.p,0)):'');
const wa=a=>`https://wa.me/${WA}?text=${encodeURIComponent(msgFor(a))}`;
function card(x,i){const inC=cart.has(x.id),cv=COVERS[x.n],sp=cv&&cv.u?cv.u:'https://open.spotify.com/search/'+encodeURIComponent((x.art+' '+x.ttl).trim());return`<article class="card" data-i="${i}" style="--h:${x.h}"><div class="cover"><div class="disc"></div><div class="face${cv?' img':''}"${cv?` style="background-image:url(${cv.i})"`:''}><span class="fmt">${x.f}</span><div class="an">${esc(x.art)}</div>${x.ttl?`<div class="at">${esc(x.ttl)}</div>`:''}</div></div><div class="info">${cv?`<div class="nm">${esc(x.art)}<small>${esc(x.ttl)}</small></div>`:''}<div class="price">${fmt(x.p)}</div><div class="tags">${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><a class="sp" target="_blank" rel="noopener" href="${sp}">Escuchar en Spotify</a><div class="acts"><button class="add${inC?' in':''}" data-id="${x.id}">${inC?'En mi caja ✓':'+ Agregar a mi caja'}</button><a class="buy" target="_blank" rel="noopener" href="${wa([x])}">Comprar por WhatsApp</a></div></div></article>`}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('.card.on').forEach(c=>c.classList.remove('on'));e.target.classList.add('on');idx=+e.target.dataset.i;count()}}),{root:$('crate'),threshold:.65});
function count(){$('cnt').innerHTML=list.length?`<b>${idx+1}</b> de ${list.length}`:'0 resultados'}
function render(){[...$('divs').children].forEach((b,i)=>b.setAttribute('aria-selected',i==cur));
const t=$('q').value.trim().toLowerCase();list=cats[cur].items.filter(x=>[...filt].every(k=>defs[k][1](x))&&(!t||t.split(/\s+/).every(w=>x.s.includes(w))));
list.sort((a,b)=>a.art.localeCompare(b.art,'es')||a.ttl.localeCompare(b.ttl,'es'));
io.disconnect();idx=0;$('crate').scrollLeft=0;
$('crate').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No hay discos con esa búsqueda. Prueba con otro nombre o quita un filtro.</div>';
if(!$('crate').classList.contains('grid'))$('crate').querySelectorAll('.card').forEach(c=>io.observe(c));
count();bottom()}
function go(i){const c=$('crate').children[Math.max(0,Math.min(list.length-1,i))];c&&c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
$('pv').onclick=()=>go(idx-1);$('nx').onclick=()=>go(idx+1);
$('rnd').onclick=()=>{if(list.length)go(Math.floor(Math.random()*list.length))};
$('vw').onclick=()=>{const g=$('crate').classList.toggle('grid');$('vw').textContent=g?'Caja':'Lista';render()};
$('q').oninput=render;
$('crate').onclick=e=>{const b=e.target.closest('.add');if(!b)return;const x=list.find(y=>y.id==b.dataset.id);cart.has(x.id)?cart.delete(x.id):cart.set(x.id,x);save();b.classList.toggle('in',cart.has(x.id));b.textContent=cart.has(x.id)?'En mi caja ✓':'+ Agregar a mi caja';bottom()};
function bottom(){const a=[...cart.values()],t=a.reduce((s,x)=>s+x.p,0);$('bottom').innerHTML=a.length?`<button class="buy" id="open">Mi caja (${a.length}) · ${fmt(t)} — Ver y pedir</button>`:`<div class="sub" style="text-align:center;margin:0">Toca “+ Agregar” para armar tu caja y pedir todo junto</div>`;
if(a.length)$('open').onclick=sheet}
function sheet(){const a=[...cart.values()],t=a.reduce((s,x)=>s+x.p,0);$('sheet').hidden=false;
$('panel').innerHTML=`<h2>Mi caja</h2>${a.map(x=>`<div class="li"><div>${esc(x.art)}<small>${esc(x.ttl)} · ${x.f}</small></div><div><b>${fmt(x.p)}</b><button class="x" data-r="${x.id}" aria-label="Quitar">×</button></div></div>`).join('')||'<p class="sub">Tu caja está vacía.</p>'}<div class="tot"><span>Total</span><span>${fmt(t)}</span></div>${a.length?`<a class="buy" target="_blank" rel="noopener" href="${wa(a)}">Pedir por WhatsApp</a>`:''}<button class="add" id="cl" style="margin-top:8px">Seguir escarbando</button>`;
$('cl').onclick=()=>$('sheet').hidden=true}
$('panel').onclick=e=>{const r=e.target.closest('[data-r]');if(r){cart.delete(+r.dataset.r);save();sheet();bottom();render2()}};
function render2(){document.querySelectorAll('.add[data-id]').forEach(b=>{const on=cart.has(+b.dataset.id);b.classList.toggle('in',on);b.textContent=on?'En mi caja ✓':'+ Agregar a mi caja'})}
$('sheet').onclick=e=>{if(e.target.id=='sheet')$('sheet').hidden=true};
const cr=$('crate');let dn=false,sx=0,sl=0,moved=false;
cr.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button||cr.classList.contains('grid')||e.target.closest('a,button'))return;dn=true;moved=false;sx=e.clientX;sl=cr.scrollLeft});
addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-sx;if(!moved&&Math.abs(dx)>5){moved=true;cr.classList.add('drag')}if(moved)cr.scrollLeft=sl-dx});
addEventListener('pointerup',()=>{if(!dn)return;dn=false;if(!moved)return;cr.classList.remove('drag');const m=cr.scrollLeft+cr.clientWidth/2;let b=null,bd=1e9;[...cr.children].forEach(c=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-m);if(d<bd){bd=d;b=c}});b&&cr.scrollTo({left:b.offsetLeft+b.offsetWidth/2-cr.clientWidth/2,behavior:'smooth'})});
cr.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||cr.classList.contains('grid'))return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
chips();render();
</script></body></html>
